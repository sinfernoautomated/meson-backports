name: Update Debian Changelog for Meson

on:
  schedule:
    - cron: '0 2 * * *' # Prüft täglich um 02:00 Uhr nachts
  workflow_dispatch: # Erlaubt den manuellen Start im Browser

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y devscripts dpkg-dev jq

      - name: Fetch latest Meson Release from GitHub API
        id: fetch_upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/mesonbuild/meson/releases/latest | jq -r .tag_name)
          VERSION=${LATEST_TAG#v}
          echo "LATEST_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Gefundene Upstream-Version: $VERSION"

      - name: Create or Update Debian Changelog
        run: |
          # Trage hier deine echten Daten ein
          export DEBEMAIL="nofunction@gmx.net"
          export DEBFULLNAME="soul-inferno"
          
          # Sicherstellen, dass das debian-Verzeichnis existiert
          mkdir -p debian

          # Prüfen, ob die Datei fehlt, leer ist oder nicht geparst werden kann
          if [ ! -s debian/changelog ] || ! dpkg-parsechangelog >/dev/null 2>&1; then
            echo "debian/changelog fehlt, ist leer oder ungültig. Erstelle eine initiale Datei..."
            rm -f debian/changelog
            dch --create -v "${{ env.LATEST_VERSION }}-1" -p --package meson "Initial upstream release sync for version ${{ env.LATEST_VERSION }}"
            dch -r -D noble ""
          else
            CURRENT_VERSION=$(dpkg-parsechangelog -S Version | cut -d'-' -f1)
            echo "Aktuelle lokale Version: $CURRENT_VERSION"
            
            if [ "${{ env.LATEST_VERSION }}" != "$CURRENT_VERSION" ]; then
              echo "Neue Version entdeckt. Aktualisiere Changelog..."
              dch -v "${{ env.LATEST_VERSION }}-1" "Automatic update to upstream release ${{ env.LATEST_VERSION }}"
              dch -r -D noble ""
            else
              echo "Changelog ist bereits auf dem neuesten Stand."
            fi
          fi

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(changelog): update/create debian/changelog to ${{ env.LATEST_VERSION }}"
          branch: main
          file_pattern: debian/changelog
